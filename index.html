<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"content="width=device-width, initial-scale=1.0">
<title>A Special Question</title>
<style>

*{margin:0;
padding:0;
box-sizing:border-box;
}
body{
font-family: Arial, sans-serif;
background:linear-gradient(135deg,#ff9a9e, #fad0c4);
height:100vh;
display:flex;
justify-content:center;
align-items: center;
}
.container{
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 0 20px rgba(0, 0, 0,0.2);
max-width:600px;
width:90%;
}
h1{
color:#ff4081;
margin-bottom:20px;
}
p{
color:#555;
font-size:18px;
line-height:1.6;
margin-bottom:25px;
}
.heart{
font-size:60px;
color:red;
animation:beat is infinite;
margin-bottom:20px;
}
@keyframes beat{
0%{transform:scale(1);}
50%{transform:scale(1.2);}
100%{transform:scale(1);}
}
button{
padding:15px 30px;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;
margin:10px;
color:white;
}
.yes{
background:#28a745;
}
.no{background:#dc3545;
}
button:hover{
opacity:0.9;
}
#response{
margin-top:20px;
font-size:22px;
font-weight:bold;
color:#ff4081;
}
</style>
</head>
<body>

<div class="container">

<div class="heart">❤</div>

<p>
Every moment spent with you has made life more beautiful.
Your smile brightnes my day, and your presence makes everything better.
</p>
<p>
I have something important to ask...
</p>
<h2>Will You Be My Girlfriend?💖</h2>
 
<button class="Yes"onclick="location.href='Yes.html'">Yes ❤</button>
<button class="No" onclick="location.href='No.html'">No 😢</button>
<div id="response"></div>

</div>

<script>

function sayYes(){
document.getElementById("response").innerHTML =
"🎉You just made me the happiest person alive!  ❤️";
}
function sayNo(){
document.getElementById("response").innerHTML =
"😊 That's okay. Thank you for visiting this page.";
}
</script>

</body>
</html>
